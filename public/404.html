<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>TOTEM RENTAL</title>
    <script>
      var path = window.location.pathname;
      var parts = path.split("/").filter(Boolean);
      var isProjectPage = parts.length > 1;
      var base = isProjectPage ? "/" + parts[0] + "/" : "/";
      var route = isProjectPage ? "/" + parts.slice(1).join("/") : path;
      window.location.replace(base + "?redirect=" + encodeURIComponent(route + window.location.search + window.location.hash));
    </script>
  </head>
  <body></body>
</html>
